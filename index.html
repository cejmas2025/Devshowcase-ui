<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevShowcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DevShowcase</h1>
        <p>Seu espaço para apresentar projetos de tecnologia.</p>
    </header>

    <main>
        <section class="intro">
            <h2>Projetos em destaque</h2>
            <p>Conheça projetos, tecnologias e ideias de desenvolvedores.</p>
            <button id="loadProjects">Carregar projetos</button>
        </section>

        <section id="projects" class="projects">
            <p>Clique em "Carregar projetos" para visualizar os projetos.</p>
        </section>
    </main>

    <footer>
        <p>DevShowcase — Projeto Integrador</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
